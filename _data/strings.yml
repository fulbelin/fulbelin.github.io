community:
  heading: "Reliability is a community problem."
  body_1: >-
    Alongside my technical research, I'm interested in the reliability, transparency and
    societal implications of increasingly capable AI systems — the same questions that make
    reproducibility and careful evaluation central to how I work.
  body_2: >-
    I previously led <strong>Marketing and Outreach</strong> at
    <a href="https://www.ais-saarland.org/" rel="noopener">AI Safety Saarland (AISS)</a>, a
    student-led initiative promoting safe, fair and beneficial AI development, where I built
    the brand identity and coordinated interdisciplinary programmes and a mentorship network
    at Saarland University.

contact:
  heading: "Let's connect."
  body: >-
    I'm always glad to hear about research collaborations, academic discussions and
    interdisciplinary projects — in computational pathology, scientific AI, or anywhere the
    two meet.

subtitle: "Bioinformatik · Maschinelles Lernen · Wissenschaftliche KI"
intro: >-

 Ich forsche in Deutschland an der Schnittstelle von Bioinformatik und Societal Computing und
 entwickle KI-Modelle für die biomedizinische Forschung sowie großskalige Datensysteme für die
 Erforschung gesellschaftlicher Fragen.

 Mein Ziel ist es, wissenschaftliche Erkenntnis durch verlässliche, autonome KI-Systeme
 voranzubringen, die evidenzbasiert schließen und unter Unsicherheit entscheiden können.

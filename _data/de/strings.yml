community:
  heading: "Verlässlichkeit ist eine gemeinschaftliche Aufgabe."
  body_1: >-
    Neben meiner technischen Forschung beschäftige ich mich mit der Verlässlichkeit, der
    Transparenz und den gesellschaftlichen Folgen immer leistungsfähigerer KI-Systeme — also
    mit denselben Fragen, die Reproduzierbarkeit und sorgfältige Evaluation zum Kern meiner
    Arbeitsweise machen.
  body_2: >-
    Zuvor habe ich <strong>Marketing und Outreach</strong> bei
    <a href="https://www.ais-saarland.org/" rel="noopener">AI Safety Saarland (AISS)</a>
    geleitet, einer studentischen Initiative für eine sichere, faire und nützliche
    KI-Entwicklung. Dort habe ich die Markenidentität aufgebaut und interdisziplinäre
    Programme sowie ein Mentoring-Netzwerk an der Universität des Saarlandes koordiniert.

contact:
  heading: "Nehmen wir Kontakt auf."
  body: >-
    Über Forschungskooperationen, fachlichen Austausch und interdisziplinäre Projekte freue
    ich mich jederzeit — in der computergestützten Pathologie, in der wissenschaftlichen KI
    oder überall dort, wo beides zusammenkommt.

  image_caption: "Analyzing the relationship between 1. FC Saarbrücken match weekends and local restaurant occupancy using large-scale geospatial data. Average occupancy increased from 30.8% on non-game weekends to 48.3% on away-game weekends."
  body: >-
    At I2SC, I develop scalable geospatial data pipelines using Python, FastAPI, PostgreSQL/PostGIS, and Redis/Celery, supporting research across 300,000+ locations in 50+ regions. By optimizing asynchronous processing and distributed workflows, I reduced per-record processing time by 35%, enabling faster and more efficient large-scale computational social science research.

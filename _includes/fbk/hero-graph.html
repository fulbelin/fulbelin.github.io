{%- comment -%}
Decorative tissue-graph: nodes and edges in sage with a few champagne-gold hubs.
Purely ornamental — hidden from assistive tech by the wrapper's aria-hidden.
{%- endcomment -%}
<svg viewBox="0 0 400 400" role="presentation">
  <g class="graph-edges">
    <line class="graph-edge" x1="62" y1="128" x2="128" y2="66"/>
    <line class="graph-edge" x1="62" y1="128" x2="112" y2="204"/>
    <line class="graph-edge" x1="128" y1="66" x2="196" y2="140"/>
    <line class="graph-edge" x1="196" y1="140" x2="112" y2="204"/>
    <line class="graph-edge" x1="196" y1="140" x2="264" y2="88"/>
    <line class="graph-edge" x1="264" y1="88" x2="336" y2="132"/>
    <line class="graph-edge" x1="196" y1="140" x2="266" y2="206"/>
    <line class="graph-edge" x1="336" y1="132" x2="266" y2="206"/>
    <line class="graph-edge" x1="112" y1="204" x2="150" y2="292"/>
    <line class="graph-edge" x1="266" y1="206" x2="226" y2="290"/>
    <line class="graph-edge" x1="150" y1="292" x2="226" y2="290"/>
    <line class="graph-edge" x1="150" y1="292" x2="70" y2="314"/>
    <line class="graph-edge" x1="226" y1="290" x2="316" y2="300"/>
    <line class="graph-edge" x1="266" y1="206" x2="316" y2="300"/>
    <line class="graph-edge" x1="112" y1="204" x2="196" y2="140"/>
    <line class="graph-edge" x1="70" y1="314" x2="112" y2="204"/>
    <line class="graph-edge" x1="226" y1="290" x2="196" y2="140"/>
    <line class="graph-edge" x1="264" y1="88" x2="336" y2="132"/>
  </g>

  <g class="graph-nodes">
    <circle class="graph-node" cx="62" cy="128" r="4.5" style="animation-delay: -0.4s"/>
    <circle class="graph-node" cx="128" cy="66" r="3.5" style="animation-delay: -1.9s"/>
    <circle class="graph-node" cx="112" cy="204" r="4" style="animation-delay: -3.1s"/>
    <circle class="graph-node" cx="264" cy="88" r="3.5" style="animation-delay: -2.4s"/>
    <circle class="graph-node" cx="336" cy="132" r="4" style="animation-delay: -5.2s"/>
    <circle class="graph-node" cx="70" cy="314" r="3.5" style="animation-delay: -1.1s"/>
    <circle class="graph-node" cx="150" cy="292" r="4" style="animation-delay: -4.3s"/>
    <circle class="graph-node" cx="316" cy="300" r="3.5" style="animation-delay: -2.8s"/>
    <circle class="graph-node" cx="226" cy="290" r="4.5" style="animation-delay: -6.1s"/>

    <circle class="graph-node--ring" cx="196" cy="140" r="12"/>
    <circle class="graph-node graph-node--gold" cx="196" cy="140" r="6" style="animation-delay: -0.9s"/>

    <circle class="graph-node--ring" cx="266" cy="206" r="10" style="animation-delay: -3.5s"/>
    <circle class="graph-node graph-node--gold" cx="266" cy="206" r="5" style="animation-delay: -3.5s"/>
  </g>
</svg>
